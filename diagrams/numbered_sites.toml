# Formerly Naming1-55.jl
title = "Numbered sites and DERs"
description = "The 55 sites numbered 1–55 (rooftop PV in red) plus the three DER buses."
output = "SingleLineDiagram4"
formats = ["pdf", "png", "svg"]

[canvas]
size = [6300, 4000]
dpi = 300
font = "Courier"
margins_cm = { top = 2, bottom = 1, right = 1 }

[lines]
width = 18
color = "blue"
alpha = 1.0

[substation]
marker = { color = "red", size = 180, dy = -1.25 }
label = { text = "Substation", color = "red", size = 90, dy = 5 }

[[markers]]
name = "Sites without rooftop PV"
buses = [47, 70, 73, 74, 83, 178, 208, 225, 264, 276, 314, 327, 342, 349, 387, 388,
         406, 502, 522, 539, 562, 563, 611, 614, 619, 639, 676, 688, 702, 755, 778, 780,
         785, 813, 817, 835, 860, 861, 898, 899, 900]
color = "black"
size = 120
dy = -0.5

[[markers]]
name = "Sites with rooftop PV"
buses = [34, 248, 249, 289, 320, 337, 458, 556, 629, 682, 701, 886, 896, 906]
color = "red"
size = 140
dy = -0.5

[[markers]]
name = "DERs"
buses = [617, 786, 881]
color = "red"
size = 160
dy = -1.0

[[labels]]
name = "Site numbers"
color = "black"
size = 100

